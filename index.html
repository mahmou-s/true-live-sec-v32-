<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRUE LIVE SEC V54</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1c;color:#e2e8f0;font-family:'Segoe UI',Tahoma,sans-serif;padding:15px}
.container{max-width:900px;margin:auto}
.header{text-align:center;padding:22px;border:2px solid #00ff88;border-radius:16px;margin-bottom:20px;background:#0f1a2e}
.header h1{color:#00ff88;font-size:28px}
.badge{display:inline-block;background:#00ff88;color:#000;padding:4px 10px;border-radius:20px;font-size:11px;margin:4px;font-weight:bold}
.search-wrap{position:relative;margin:20px 0 10px}
.search-box{display:flex;gap:10px}
.search-box input{flex:1;padding:14px;border-radius:10px;border:1px solid #1e3a5f;background:#13233f;color:#fff;font-size:16px}
.search-box button{padding:14px 24px;background:#00ff88;color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
.sugg{position:absolute;top:100%;right:0;left:0;margin-top:6px;background:#0f1a2e;border:1px solid #1e3a5f;border-radius:10px;z-index:10;overflow:hidden}
.sugg-item{padding:11px 14px;border-bottom:1px solid #1e3a5f;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.sugg-item:last-child{border-bottom:none}
.sugg-item:hover{background:#13233f}
.sugg-item b{color:#00ff88;direction:ltr}
.sugg-item span{color:#94a3b8;direction:ltr;text-align:left;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{padding:8px 14px;background:#1e293b;border:1px solid #334155;border-radius:20px;cursor:pointer;font-size:13px}
.chip:hover{border-color:#00ff88;color:#00ff88}
.card{background:#0f1a2e;border:1px solid #1e3a5f;border-radius:14px;padding:18px;margin-bottom:14px}
.card h3{color:#00ff88;margin-bottom:12px;font-size:16px;border-bottom:1px solid #1e3a5f;padding-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:#13233f;padding:10px;border-radius:8px;word-break:break-word}
.item b{color:#94a3b8;font-size:11px;display:block}
.item span{font-size:14px;font-weight:bold}
.src{margin-top:12px;font-size:12px}
.src a{color:#00ff88}
.warn{border:1px solid #f59e0b;color:#fbbf24}
.alt{background:transparent;border:1px solid #00ff88;color:#00ff88;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:13px;margin-bottom:16px}
.gitem{padding:12px;border:1px solid #1e3a5f;border-radius:10px;background:#13233f;margin-bottom:8px;cursor:pointer}
.gitem:hover{border-color:#00ff88}
.gitem .gn{font-weight:bold;font-size:14px}
.gitem .gm{font-size:12px;color:#94a3b8;margin-top:4px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#1e293b;border:1px solid #334155;margin-inline-start:6px}
.tag.ok{border-color:#00ff88;color:#00ff88}
.tag.bad{border-color:#f59e0b;color:#fbbf24}
.tag.weak{border-color:#ef4444;color:#f87171}
.footer{text-align:center;font-size:11px;color:#64748b;margin-top:30px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>TRUE LIVE SEC V54</h1>
    <div>كل شركات SEC - بحث بالاسم او الرمز</div>
    <div>
      <span class="badge">SEC EDGAR</span>
      <span class="badge">VERCEL API</span>
      <span class="badge" id="count">...</span>
    </div>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <input id="q" placeholder="اكتب اسم الشركة او الرمز: Tesla, AAPL, Ford..." autocomplete="off" oninput="onInput()">
      <button onclick="search()">بحث عميق</button>
    </div>
    <div id="sugg" class="sugg" style="display:none"></div>
  </div>

  <div class="chips" id="chips"></div>
  <button class="alt" onclick="searchGleif()">بحث عالمي في سجل الكيانات (GLEIF)</button>
  <div id="result"></div>
  <div class="footer">V54 - المصادر: SEC.gov وGLEIF عبر /api</div>
</div>
<script>window.onerror=function(m,s,l){document.body.prepend('ERR: '+m+' @line '+l)}</script>
<script>
  const POPULAR = ['AAPL','MSFT','NVDA','TSLA','AMZN','GOOGL','META','NFLX','AMD','INTC','JPM','V','WMT','KO','DIS','BA','NKE','PFE'];
let TICKERS = [];
let last = [];
let secCtx = null;
let backTo = null;

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function api(params){
  const r = await fetch('/api/sec?' + new URLSearchParams(params));
  if(!r.ok){
    let msg = 'HTTP ' + r.status;
    try{ msg = (await r.json()).error || msg; }catch(e){}
    throw new Error(msg);
  }
  return r.json();
}

// تحميل قائمة كل الشركات مرة واحدة
const ready = (async () => {
  const d = await api({type:'tickers'});
  TICKERS = Object.values(d).map(x => ({ticker:x.ticker, title:x.title, cik:String(x.cik_str)}));
  document.getElementById('count').textContent = TICKERS.length.toLocaleString('en-US') + ' شركة';
})();
ready.catch(e => { document.getElementById('count').textContent = 'خطأ تحميل'; });

document.getElementById('chips').innerHTML =
  POPULAR.map(t => `<div class="chip" onclick="setQ('${t}')">${t}</div>`).join('');

function matches(q){
  q = q.trim().toLowerCase();
  if(!q) return [];
  const exact = [], starts = [], inc = [];
  for(const c of TICKERS){
    const t = c.ticker.toLowerCase(), n = c.title.toLowerCase();
    if(t === q) exact.push(c);
    else if(t.startsWith(q) || n.startsWith(q)) starts.push(c);
    else if(n.includes(q)) inc.push(c);
  }
  const byLen = (a, b) => a.title.length - b.title.length;
  return [...exact, ...starts.sort(byLen), ...inc.sort(byLen)].slice(0, 8);
}

function onInput(){
  const box = document.getElementById('sugg');
  last = matches(document.getElementById('q').value);
  if(!last.length){ box.style.display = 'none'; return; }
  box.innerHTML = last.map((c,i) =>
    `<div class="sugg-item" onclick="pick(${i})"><b>${esc(c.ticker)}</b><span>${esc(c.title)}</span></div>`
  ).join('');
  box.style.display = 'block';
}

function pick(i){
  const c = last[i];
  if(!c) return;
  document.getElementById('q').value = c.ticker;
  load(c);
}

function setQ(t){
  document.getElementById('q').value = t;
  search();
}

async function search(){
  const box = document.getElementById('result');
  const q = document.getElementById('q').value.trim();
  if(!q) return;
  try{
    await ready;
  }catch(e){
    box.innerHTML = `<div class="card" style="border-color:#ff4444">خطأ: ${esc(e.message)}</div>`;
    return;
  }
  const m = matches(q);
  if(!m.length){
    box.innerHTML = `<div class="card" style="border-color:#ff4444">ما لقيتش شركة بالاسم ده في SEC. جرب رمز السهم (زي F او KO) او اسم تاني.</div>`;
    return;
  }
  load(m[0]);
  }
  async function load(c){
  document.getElementById('sugg').style.display = 'none';
  const box = document.getElementById('result');
  box.innerHTML = `<div class="card">جاري الجلب من SEC لـ ${esc(c.title)} (${esc(c.ticker)})...</div>`;
  try{
    const [sub, fin] = await Promise.all([
      api({type:'submissions', cik:c.cik}),
      api({type:'facts', cik:c.cik})
    ]);
    secCtx = {name: sub.name || c.title, incorp: sub.stateOfIncorporation || null, c};
    render(c.ticker, sub, fin);
  }catch(e){
    box.innerHTML = `<div class="card" style="border-color:#ff4444">خطأ: ${esc(e.message)}<br><small>بعض الشركات (بنوك او صناديق) ما عندهاش كل الارقام في SEC، جرب شركة تانية.</small></div>`;
  }
}
async function load(c){
  document.getElementById('sugg').style.display = 'none';
  const box = document.getElementById('result');
  box.innerHTML = `<div class="card">جاري الجلب من SEC لـ ${esc(c.title)} (${esc(c.ticker)})...</div>`;
  try{
    const [sub, fin] = await Promise.all([
      api({type:'submissions', cik:c.cik}),
      api({type:'facts', cik:c.cik})
    ]);
    secCtx = {name: sub.name || c.title, incorp: sub.stateOfIncorporation || null, c};
    render(c.ticker, sub, fin);
  }catch(e){
    box.innerHTML = `<div class="card" style="border-color:#ff4444">خطأ: ${esc(e.message)}<br><small>بعض الشركات (بنوك او صناديق) ما عندهاش كل الارقام في SEC، جرب شركة تانية.</small></div>`;
  }
}

function money(v, cur){
  const c = cur || 'USD';
  const pre = c === 'USD' ? '$' : c + ' ';
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  if(a >= 1e12) return s + pre + (a/1e12).toFixed(2) + 'T';
  if(a >= 1e9) return s + pre + (a/1e9).toFixed(2) + 'B';
  if(a >= 1e6) return s + pre + (a/1e6).toFixed(2) + 'M';
  if(a >= 1e3) return s + pre + (a/1e3).toFixed(1) + 'K';
  return s + pre + a.toFixed(0);
}

function render(ticker, p, f){
  const fmt = o => o ? `<bdi dir="ltr">${money(o.val, o.cur)} <small>(${esc(o.end)})</small>${o.usd ? `<br><small>≈ ${money(o.usd.val, 'USD')}</small>` : ''}</bdi>` : 'N/A';
  const web = p.website ? esc(p.website) : 'N/A';
  const form = f.form || '10-K';
  const figs = [f.revenue, f.netIncome, f.eps, f.assets, f.cash, f.debt];
  const none = !figs.some(Boolean);
  const foreignCur = figs.some(x => x && x.cur && x.cur !== 'USD');
  const newestEnd = figs.filter(Boolean).map(x => x.end).sort().pop() || null;
  const lagDays = (p.lastAnnualDate && newestEnd) ? (Date.parse(p.lastAnnualDate) - Date.parse(newestEnd)) / 86400000 : 0;
  const secLink = `https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${encodeURIComponent(p.cik || '')}&type=${encodeURIComponent(form)}&dateb=&owner=include&count=40`;
  const finBlock = none
    ? `<div class="item" style="grid-column:1/-1"><span>ما لقيناش أرقام سنوية (10-K او 20-F) لهذا السجل في SEC.</span><br><small>أسباب محتملة: تقريرها بنموذج غير مدعوم بعد (زي 40-F)، أو سجل جديد لسه ما قدّمش تقرير سنوي، أو أرقام مسجلة بأسماء غير قياسية.</small></div>`
    : `<div class="item"><b>Revenue</b><span>${fmt(f.revenue)}</span></div>
      <div class="item"><b>Net Income</b><span>${fmt(f.netIncome)}</span></div>
      <div class="item"><b>EPS</b><span><bdi dir="ltr">${f.eps ? (f.eps.cur && f.eps.cur !== 'USD' ? esc(f.eps.cur) + ' ' : '') + esc(f.eps.val) : 'N/A'} <small>${f.eps ? '(' + esc(f.eps.end) + ')' : ''}</small>${f.eps && f.eps.usd ? `<br><small>≈ $${esc(f.eps.usd.val)}</small>` : ''}</bdi></span></div>
      <div class="item"><b>Assets</b><span>${fmt(f.assets)}</span></div>
      <div class="item"><b>Cash</b><span>${fmt(f.cash)}</span></div>
      <div class="item"><b>Long-term debt</b><span>${fmt(f.debt)}</span></div>`;
  const warn = (!none && lagDays > 250)
    ? `<div class="item warn" style="grid-column:1/-1"><small>تنبيه: آخر تقرير سنوي (<bdi>${esc(p.lastAnnualForm || '')}</bdi>) اتقدّم لـ SEC بتاريخ <bdi>${esc(p.lastAnnualDate)}</bdi>، لكن الأرقام أعلاه لسنة منتهية <bdi>${esc(newestEnd)}</bdi>. قد توجد أرقام أحدث في التقرير نفسه، تحقق من الرابط تحت.</small></div>`
    : '';
  const notes = [];
  if (!none && foreignCur) notes.push('الأرقام بعملة الشركة حسب تقريرها. ما يعادلها بالدولار (≈) كما أفصحت عنه الشركة لو متوفر. الربحية لكل سهم عادي (مش لكل ADR).');
  if (!none && f.standard === 'IFRS') notes.push('الديون غير معروضة لشركات IFRS حاليا.');
  document.getElementById('result').innerHTML = `
  <div class="card">
    <h3><bdi>${esc(p.name || ticker)}</bdi> (<bdi>${esc(ticker)}</bdi>)</h3>
    <div class="grid">
      <div class="item"><b>الموقع</b><span>${web}</span></div>
      <div class="item"><b>التليفون</b><span><bdi>${esc(p.phone || 'N/A')}</bdi></span></div>
      <div class="item"><b>العنوان</b><span><bdi>${esc(p.address || 'N/A')}</bdi></span></div>
      <div class="item"><b>التصنيف</b><span><bdi>${esc(p.sicDescription || 'N/A')}</bdi></span></div>
      <div class="item"><b>CIK</b><span>${esc(p.cik || 'N/A')}</span></div>
      <div class="item"><b>آخر تقديم</b><span><bdi>${esc(p.lastFilingForm || '')}</bdi> ${esc(p.lastFilingDate || 'N/A')}</span></div>
    </div>
  </div>
  <div class="card">
    <h3>المالية - آخر سنة <bdi>${esc(form)}</bdi>${f.standard ? ' · <bdi>' + esc(f.standard) + '</bdi>' : ''}</h3>
    <div class="grid">${finBlock}${warn}</div>
    ${notes.length ? `<div class="src">${notes.join(' ')}</div>` : ''}
    <div class="src"><a href="${secLink}" target="_blank" rel="noopener">تحقق من المصدر على SEC.gov</a></div>
  </div>
  <button class="alt" onclick="matchGleif()">دوّر على سجل الشركة دي في GLEIF (مطابقة محتملة)</button>
  <div id="gmatch"></div>`;
  }
  // ================= GLEIF: بحث عالمي وبطاقة هوية =================
let lastGleif = null;

async function leiApi(params){
  const r = await fetch('/api/lei?' + new URLSearchParams(params));
  if(!r.ok){
    let msg = 'HTTP ' + r.status;
    try{ msg = (await r.json()).error || msg; }catch(e){}
    throw new Error(msg);
  }
  return r.json();
}

function countryName(c){
  if(!c) return 'N/A';
  try{ return new Intl.DisplayNames(['ar'], {type:'region'}).of(c) || c; }catch(e){ return c; }
}

function statusTag(s){
  if(s === 'ACTIVE') return '<span class="tag ok">نشط</span>';
  if(s === 'INACTIVE') return '<span class="tag bad">غير نشط</span>';
  return s ? '<span class="tag">' + esc(s) + '</span>' : '';
}

const dateOnly = s => s ? String(s).slice(0, 10) : 'N/A';

async function searchGleif(){
  const box = document.getElementById('result');
  const q = document.getElementById('q').value.trim();
  document.getElementById('sugg').style.display = 'none';
  if(q.length < 2){
    box.innerHTML = `<div class="card" style="border-color:#ff4444">اكتب اسم الشركة (حرفين على الاقل) في الخانة فوق، وبعدين دوس بحث عالمي.</div>`;
    return;
  }
  box.innerHTML = `<div class="card">جاري البحث في سجل GLEIF عن "${esc(q)}"...</div>`;
  try{
    const d = await leiApi({type:'search', q});
    lastGleif = d;
    backTo = () => renderGleifList(lastGleif);
    renderGleifList(d);
  }catch(e){
    box.innerHTML = `<div class="card" style="border-color:#ff4444">خطأ: ${esc(e.message)}</div>`;
  }
}
function renderGleifList(d){
  const items = d.items || [];
  const rows = items.map(x => `<div class="gitem" onclick="loadLei('${esc(x.lei)}')">
      <div class="gn"><bdi>${esc(x.name || 'N/A')}</bdi></div>
      <div class="gm"><bdi>${esc(x.city || '')}</bdi> · ${esc(countryName(x.country))} ${statusTag(x.status)}</div>
    </div>`).join('');
  const more = (d.total && d.total > d.shown) ? ' (عرض ' + d.shown + ' من ' + d.total + ')' : '';
  document.getElementById('result').innerHTML = `
  <div class="card">
    <h3>نتائج GLEIF${esc(more)}</h3>
    ${rows || '<div class="item">ما لقيناش نتائج بالاسم ده. جرب الاسم القانوني الكامل بالانجليزي.</div>'}
    <div class="src">GLEIF سجل عالمي للكيانات القانونية، بيشمل شركات وصناديق وجهات تانية، ومش كل شركة موجودة فيه. البحث بكلمات الاسم، ولو الشركة المطلوبة مش ظاهرة جرّب اسمها القانوني الكامل.</div>
  </div>`;
}

async function loadLei(lei){
  const box = document.getElementById('result');
  box.innerHTML = `<div class="card">جاري جلب بطاقة الهوية من GLEIF...</div>`;
  try{
    const d = await leiApi({type:'record', lei});
    renderGleifCard(d.record, d.publishDate);
  }catch(e){
    box.innerHTML = `<div class="card" style="border-color:#ff4444">خطأ: ${esc(e.message)}</div>`;
  }
  }
      // ================= V54: مطابقة محتملة بين سجل SEC وسجل GLEIF =================
// بيانات SEC مفيهاش LEI، فالمطابقة بالاسم وولاية التأسيس فقط، وبنعرضها كاحتمال مش كحقيقة
const NAME_SUFFIX = new Set(['inc','incorporated','corp','corporation','co','company','ltd','limited','plc','llc','lp','sa','nv','ag','se','ab','the']);
function stripName(s){
  let w = String(s || '').toLowerCase().replace(/&/g, ' and ').replace(/[^\p{L}\p{N}]+/gu, ' ').trim().split(' ').filter(Boolean);
  while(w.length > 1 && NAME_SUFFIX.has(w[w.length - 1])) w.pop();
  if(w.length > 1 && w[0] === 'the') w.shift();
  return w.join(' ');
}

// ولاية التأسيس في SEC (حرفين زي DE) مقابل الولاية القضائية في GLEIF (US-DE). غير الامريكي بنسيبه غير معروف
function stateCheck(incorp, jur){
  if(!/^[A-Z]{2}$/.test(incorp || '') || !jur || !/^US-/.test(jur)) return null;
  return jur === 'US-' + incorp;
}

function matchLevel(secName, incorp, it){
  const nameOk = stripName(it.name) === stripName(secName);
  const st = stateCheck(incorp, it.jurisdiction);
  if(nameOk && st === true) return {rank: 0, tag: '<span class="tag ok">مطابقة قوية: الاسم وولاية التأسيس</span>'};
  if(nameOk && st === false) return {rank: 2, tag: '<span class="tag weak">نفس الاسم لكن ولاية تأسيس مختلفة</span>'};
  if(nameOk) return {rank: 1, tag: '<span class="tag bad">مطابقة محتملة: الاسم فقط</span>'};
  return {rank: 3, tag: '<span class="tag">اسم مختلف</span>'};
}

async function matchGleifOld(){
  const box = document.getElementById('gmatch');
  const s = secCtx;
  if(!box || !s) return;
  box.innerHTML = `<div class="card">جاري البحث في GLEIF عن "${esc(s.name)}"...</div>`;
  try{
    let d = await leiApi({type:'search', q:s.name});
    let items = d.items || [];
    if(!items.length){
      const alt = stripName(s.name);
      if(alt.length >= 2 && alt !== s.name.toLowerCase()){
        d = await leiApi({type:'search', q:alt});
        items = d.items || [];
      }
    }
    const scored = items.map((it, i) => ({it, i, m: matchLevel(s.name, s.incorp, it)}))
      .sort((a, b) => a.m.rank - b.m.rank || a.i - b.i)
      .slice(0, 8);
    const rows = scored.map(x => `<div class="gitem" onclick="openMatch('${esc(x.it.lei)}')">
        <div class="gn"><bdi>${esc(x.it.name || 'N/A')}</bdi></div>
        <div class="gm"><bdi>${esc(x.it.city || '')}</bdi> · ${esc(countryName(x.it.country))} ${statusTag(x.it.status)} ${x.m.tag}</div>
      </div>`).join('');
    box.innerHTML = `
    <div class="card">
      <h3>مطابقات محتملة في GLEIF لـ <bdi>${esc(s.name)}</bdi></h3>
      ${rows || '<div class="item">ما لقيناش سجل بالاسم ده في GLEIF. مش كل شركة ليها LEI.</div>'}
      <div class="src">SEC ما بيوفّرش LEI، فالمطابقة بالاسم وولاية التأسيس بس وممكن تكون غلط، خصوصا لو فيه شركات تابعة بنفس الاسم. افتح البطاقة وتحقق من العنوان ورقم السجل قبل ما تعتمد عليها.</div>
    </div>`;
  }catch(e){
    box.innerHTML = `<div class="card" style="border-color:#ff4444">خطأ: ${esc(e.message)}</div>`;
  }
}

async function matchGleif(){
  const box = document.getElementById('gmatch');
  const s = secCtx;
  if(!box || !s) return;
  box.innerHTML = `<div class="card">جاري البحث في GLEIF عن "${esc(s.name)}"...</div>`;
  try{
    // بحثين دايما: الاسم زي ما هو في SEC، والاسم بدون اللواحق (Co/Ltd/Inc)، لان GLEIF بيكتب Company Limited مثلا
    const alt = stripName(s.name);
    const queries = [s.name];
    if(alt.length >= 2 && alt !== s.name.toLowerCase()) queries.push(alt);
    const seen = new Set();
    const items = [];
    for(const qq of queries){
      try{
        const d = await leiApi({type:'search', q:qq});
        for(const it of (d.items || [])){
          if(!seen.has(it.lei)){ seen.add(it.lei); items.push(it); }
        }
      }catch(e){
        if(qq === queries[0] && queries.length === 1) throw e;
      }
    }
    const scored = items.map((it, i) => ({it, i, m: matchLevel(s.name, s.incorp, it)}))
      .sort((a, b) => a.m.rank - b.m.rank || a.i - b.i)
      .slice(0, 8);
    const rows = scored.map(x => `<div class="gitem" onclick="openMatch('${esc(x.it.lei)}')">
        <div class="gn"><bdi>${esc(x.it.name || 'N/A')}</bdi></div>
        <div class="gm"><bdi>${esc(x.it.city || '')}</bdi> · ${esc(countryName(x.it.country))} ${statusTag(x.it.status)} ${x.m.tag}</div>
      </div>`).join('');
    box.innerHTML = `
    <div class="card">
      <h3>مطابقات محتملة في GLEIF لـ <bdi>${esc(s.name)}</bdi></h3>
      ${rows || '<div class="item">ما لقيناش سجل بالاسم ده في GLEIF. مش كل شركة ليها LEI.</div>'}
      <div class="src">SEC ما بيوفّرش LEI، فالمطابقة بالاسم وولاية التأسيس بس وممكن تكون غلط، خصوصا لو فيه شركات تابعة بنفس الاسم. افتح البطاقة وتحقق من العنوان ورقم السجل قبل ما تعتمد عليها.</div>
    </div>`;
  }catch(e){
    box.innerHTML = `<div class="card" style="border-color:#ff4444">خطأ: ${esc(e.message)}</div>`;
  }
  }
  
  function openMatch(lei){
  const c = secCtx && secCtx.c;
  backTo = c ? () => load(c) : null;
  loadLei(lei);
}

function backToGleif(){
  if(backTo) backTo();
}

// تطبيع نص العنوان للمقارنة: حروف وارقام فقط، بدون مسافات او علامات او فرق حروف كبيرة/صغيرة
const normAddr = s => String(s == null ? '' : s).toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');

// المقر = العنوان القانوني؟ المقارنة على مفتاح كامل من api/lei.js (اسطر العنوان + رقم المبنى + الولاية + الرمز البريدي + المدينة + الدولة)
function sameAddress(r){
  if(!r.hqAddress || !r.legalKey || !r.hqKey) return false;
  return normAddr(r.legalKey) === normAddr(r.hqKey);
}
  function renderGleifCard(r, pub){
  const legal = [r.city, r.region, countryName(r.country)].filter(Boolean).join('، ');
  const hq = (r.hqCity || r.hqCountry) ? [r.hqCity, r.hqCountry ? countryName(r.hqCountry) : null].filter(Boolean).join('، ') : null;
  const item = (label, val) => `<div class="item"><b>${label}</b><span><bdi>${val == null || val === '' ? 'N/A' : val}</bdi></span></div>`;
  const merged = sameAddress(r);
  const addrItems = merged
    ? `${item('العنوان القانوني والمقر (نفس العنوان في GLEIF)', esc(legal))}
      ${item('تفاصيل العنوان', esc(r.address))}`
    : `${item('العنوان القانوني', esc(legal))}
      ${item('تفاصيل العنوان القانوني', esc(r.address))}
      ${item('المقر حسب GLEIF', esc(hq))}
      ${item('عنوان المقر', esc(r.hqAddress))}`;
  document.getElementById('result').innerHTML = `
  <div class="card">
    <h3><bdi>${esc(r.name || 'N/A')}</bdi> <span class="badge">GLEIF</span></h3>
    <div class="grid">
      ${item('الحالة', statusTag(r.status) || 'N/A')}
      ${item('حالة التسجيل', esc(r.regStatus))}
      ${item('الدولة (العنوان القانوني)', esc(countryName(r.country)))}
      ${addrItems}
      ${item('الولاية القضائية', esc(r.jurisdiction))}
      ${item('رقم السجل الوطني', esc(r.registeredAs))}
      ${item('تاريخ التأسيس', esc(dateOnly(r.created)))}
      ${item('نوع الكيان', esc(r.category))}
      ${item('LEI', esc(r.lei))}
      ${item('آخر تحديث للسجل', esc(dateOnly(r.updated)))}
    </div>
    <div class="src">بطاقة هوية فقط من GLEIF، بدون بيانات مالية. ${merged ? 'GLEIF بيسجّل نفس العنوان للتسجيل القانوني وللمقر، فعرضناه مرة واحدة.' : 'العنوان القانوني هو مكان تسجيل الكيان، والمقر بيتسجّل بشكل منفصل في GLEIF وممكن يختلف عنه.'} تاريخ نشر بيانات GLEIF: <bdi>${esc(dateOnly(pub))}</bdi>.</div>
    <div class="src"><a href="https://search.gleif.org/#/record/${encodeURIComponent(r.lei || '')}" target="_blank" rel="noopener">تحقق من المصدر على GLEIF</a>${backTo ? ' · <a href="#" onclick="backToGleif();return false;">رجوع للنتائج</a>' : ''}</div>
  </div>`;
}
</script>
</body>
</html>
