<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRUE LIVE SEC V46</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1c;color:#e2e8f0;font-family:'Segoe UI',Tahoma,sans-serif;padding:15px}
.container{max-width:900px;margin:auto}
.header{text-align:center;padding:22px;border:2px solid #00ff88;border-radius:16px;margin-bottom:20px;background:#0f1a2e}
.header h1{color:#00ff88;font-size:28px}
.badge{display:inline-block;background:#00ff88;color:#000;padding:4px 10px;border-radius:20px;font-size:11px;margin:4px;font-weight:bold}
.search-wrap{position:relative;margin:20px 0 10px}
.search-box{display:flex;gap:10px}
.search-box input{flex:1;padding:14px;border-radius:10px;border:1px solid #1e3a5f;background:#13233f;color:#fff;font-size:16px}
.search-box button{padding:14px 24px;background:#00ff88;color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
.sugg{position:absolute;top:100%;right:0;left:0;margin-top:6px;background:#0f1a2e;border:1px solid #1e3a5f;border-radius:10px;z-index:10;overflow:hidden}
.sugg-item{padding:11px 14px;border-bottom:1px solid #1e3a5f;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.sugg-item:last-child{border-bottom:none}
.sugg-item:hover{background:#13233f}
.sugg-item b{color:#00ff88;direction:ltr}
.sugg-item span{color:#94a3b8;direction:ltr;text-align:left;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{padding:8px 14px;background:#1e293b;border:1px solid #334155;border-radius:20px;cursor:pointer;font-size:13px}
.chip:hover{border-color:#00ff88;color:#00ff88}
.card{background:#0f1a2e;border:1px solid #1e3a5f;border-radius:14px;padding:18px;margin-bottom:14px}
.card h3{color:#00ff88;margin-bottom:12px;font-size:16px;border-bottom:1px solid #1e3a5f;padding-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:#13233f;padding:10px;border-radius:8px;word-break:break-word}
.item b{color:#94a3b8;font-size:11px;display:block}
.item span{font-size:14px;font-weight:bold}
.footer{text-align:center;font-size:11px;color:#64748b;margin-top:30px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>TRUE LIVE SEC V46</h1>
    <div>كل شركات SEC - بحث بالاسم او الرمز</div>
    <div>
      <span class="badge">SEC EDGAR</span>
      <span class="badge">VERCEL API</span>
      <span class="badge" id="count">...</span>
    </div>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <input id="q" placeholder="اكتب اسم الشركة او الرمز: Tesla, AAPL, Ford..." autocomplete="off" oninput="onInput()">
      <button onclick="search()">بحث عميق</button>
    </div>
    <div id="sugg" class="sugg" style="display:none"></div>
  </div>

  <div class="chips" id="chips"></div>
  <div id="result"></div>
  <div class="footer">V46 - المصدر: SEC.gov عبر /api/sec</div>
</div>

<script>
const POPULAR = ['AAPL','MSFT','NVDA','TSLA','AMZN','GOOGL','META','NFLX','AMD','INTC','JPM','V','WMT','KO','DIS','BA','NKE','PFE'];
let TICKERS = [];
let last = [];

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function api(params){
  const r = await fetch('/api/sec?' + new URLSearchParams(params));
  if(!r.ok){
    let msg = 'HTTP ' + r.status;
    try{ msg = (await r.json()).error || msg; }catch(e){}
    throw new Error(msg);
  }
  return r.json();
}

// تحميل قائمة كل الشركات مرة واحدة
const ready = (async () => {
  const d = await api({type:'tickers'});
  TICKERS = Object.values(d).map(x => ({ticker:x.ticker, title:x.title, cik:String(x.cik_str)}));
  document.getElementById('count').textContent = TICKERS.length.toLocaleString('en-US') + ' شركة';
})();
ready.catch(e => { document.getElementById('count').textContent = 'خطأ تحميل'; });

document.getElementById('chips').innerHTML =
  POPULAR.map(t => `<div class="chip" onclick="setQ('${t}')">${t}</div>`).join('');

function matches(q){
  q = q.trim().toLowerCase();
  if(!q) return [];
  const exact = [], starts = [], inc = [];
  for(const c of TICKERS){
    const t = c.ticker.toLowerCase(), n = c.title.toLowerCase();
    if(t === q) exact.push(c);
    else if(t.startsWith(q) || n.startsWith(q)) starts.push(c);
    else if(n.includes(q)) inc.push(c);
  }
  return [...exact, ...starts, ...inc].slice(0, 8);
}

function onInput(){
  const box = document.getElementById('sugg');
  last = matches(document.getElementById('q').value);
  if(!last.length){ box.style.display = 'none'; return; }
  box.innerHTML = last.map((c,i) =>
    `<div class="sugg-item" onclick="pick(${i})"><b>${esc(c.ticker)}</b><span>${esc(c.title)}</span></div>`
  ).join('');
  box.style.display = 'block';
}

function pick(i){
  const c = last[i];
  if(!c) return;
  document.getElementById('q').value = c.ticker;
  load(c);
}

function setQ(t){
  document.getElementById('q').value = t;
  search();
}

async function search(){
  const box = document.getElementById('result');
  const q = document.getElementById('q').value.trim();
  if(!q) return;
  try{
    await ready;
  }catch(e){
    box.innerHTML = `<div class="card" style="border-color:#ff4444">خطأ: ${esc(e.message)}</div>`;
    return;
  }
  const m = matches(q);
  if(!m.length){
    box.innerHTML = `<div class="card" style="border-color:#ff4444">ما لقيتش شركة بالاسم ده في SEC. جرب رمز السهم (زي F او KO) او اسم تاني.</div>`;
    return;
  }
  load(m[0]);
}

async function load(c){
  document.getElementById('sugg').style.display = 'none';
  const box = document.getElementById('result');
  box.innerHTML = `<div class="card">جاري الجلب من SEC لـ ${esc(c.title)} (${esc(c.ticker)})...</div>`;
  try{
    const [sub, fin] = await Promise.all([
      api({type:'submissions', cik:c.cik}),
      api({type:'facts', cik:c.cik})
    ]);
    render(c.ticker, sub, fin);
  }catch(e){
    box.innerHTML = `<div class="card" style="border-color:#ff4444">خطأ: ${esc(e.message)}<br><small>بعض الشركات (بنوك او صناديق) ما عندهاش كل الارقام في SEC، جرب شركة تانية.</small></div>`;
  }
}

function render(ticker, p, f){
  const fmt = o => o ? `$${(o.val/1e9).toFixed(2)}B <small>(${esc(o.end)})</small>` : 'N/A';
  const web = p.website ? esc(p.website) : 'N/A';
  document.getElementById('result').innerHTML = `
  <div class="card">
    <h3><bdi>${esc(p.name || ticker)}</bdi> (<bdi>${esc(ticker)}</bdi>)</h3>
    <div class="grid">
      <div class="item"><b>الموقع</b><span>${web}</span></div>
      <div class="item"><b>التليفون</b><span><bdi>${esc(p.phone || 'N/A')}</bdi></span></div>
      <div class="item"><b>العنوان</b><span><bdi>${esc(p.address || 'N/A')}</bdi></span></div>
      <div class="item"><b>التصنيف</b><span><bdi>${esc(p.sicDescription || 'N/A')}</bdi></span></div>
      <div class="item"><b>CIK</b><span>${esc(p.cik || 'N/A')}</span></div>
      <div class="item"><b>آخر تقديم</b><span><bdi>${esc(p.lastFilingForm || '')}</bdi> ${esc(p.lastFilingDate || 'N/A')}</span></div>
    </div>
  </div>
  <div class="card">
    <h3>المالية - آخر سنة <bdi>10-K</bdi></h3>
    <div class="grid">
      <div class="item"><b>Revenue</b><span>${fmt(f.revenue)}</span></div>
      <div class="item"><b>Net Income</b><span>${fmt(f.netIncome)}</span></div>
      <div class="item"><b>EPS</b><span>${f.eps ? esc(f.eps.val) : 'N/A'} <small>${f.eps ? '(' + esc(f.eps.end) + ')' : ''}</small></span></div>
      <div class="item"><b>Assets</b><span>${fmt(f.assets)}</span></div>
      <div class="item"><b>Cash</b><span>${fmt(f.cash)}</span></div>
      <div class="item"><b>Debt</b><span>${fmt(f.debt)}</span></div>
    </div>
  </div>`;
}
</script>
</body>
</html>
