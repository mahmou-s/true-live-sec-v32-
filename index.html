<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRUE LIVE SEC V39 - LIVE VERIFIED</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#020617;color:#fff;font-family:system-ui;padding:12px}
.wrap{max-width:900px;margin:0 auto}h1{text-align:center;color:#22c55e;margin:8px 0}
.sub{text-align:center;color:#94a3b8;font-size:12px;margin-bottom:12px}
.card{background:#1e293b;border-radius:20px;padding:18px;border:1px solid #334155;margin-bottom:12px}
input{width:100%;background:#0f172a;border:2px solid #334155;border-radius:14px;padding:14px;font-size:18px;color:#fff;text-align:center;direction:ltr}
button{width:100%;background:#22c55e;color:#000;border:0;padding:14px;border-radius:14px;font-weight:700;margin-top:10px;font-size:16px}
button:disabled{opacity:.5}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.quick span{background:#334155;padding:7px 13px;border-radius:20px;font-size:14px;cursor:pointer}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;color:#000}
.live{background:#22c55e}.warn{background:#f59e0b}.err{color:#ef4444}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kpi{background:#020617;padding:10px;border-radius:12px;text-align:center}
.kpi small{color:#94a3b8;display:block}.kpi b{color:#22c55e;font-size:18px;display:block;direction:ltr}
.meta{color:#94a3b8;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>TRUE LIVE SEC V39</h1>
<div class="sub">SEC EDGAR LIVE - V39 FINAL</div>
<div class="card">
<input id="q" value="AAPL" maxlength="10" placeholder="AAPL">
<button id="go" onclick="search()">بحث LIVE V39</button>
<div class="quick" id="quick"></div>
</div>
<div id="out"></div>
<div class="card" id="chartCard" hidden><canvas id="chart" height="180"></canvas></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>s==null?'':String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtB=x=>x&&x.value!=null?(x.value/1e9).toFixed(2)+'B':'N/A';
let seq=0,chart=null;
['AAPL','MSFT','TSLA','NVDA','GOOGL','AMZN','META','NFLX'].forEach(t=>{
const s=document.createElement('span');s.textContent=t;s.onclick=()=>{$('q').value=t;search();};$('quick').appendChild(s);
});
async function search(){
const raw=$('q').value.trim().toUpperCase();
const q=raw.replace(/[^A-Z0-9.\-]/g,'').slice(0,10);
const out=$('out'),btn=$('go');
if(!q){out.innerHTML='<div class="card err">رمز غير صالح</div>';return;}
const my=++seq;btn.disabled=true;
out.innerHTML='<div class="card">جاري '+esc(q)+'...</div>';
try{
const r=await fetch('/api/company?ticker='+encodeURIComponent(q)+'&v=39&_='+Date.now());
const j=await r.json();
if(my!==seq)return;
if(!j.ok){out.innerHTML='<div class="card err">'+esc(j.error)+'</div>';return;}
const L=j.latest||{};
const badge=j.live?'<span class="badge live">LIVE - '+esc(j.asOf)+'</span>':'<span class="badge warn">OLD</span>';
const eps=L.eps&&L.eps.value!=null?'$'+Number(L.eps.value).toFixed(2):'N/A';
out.innerHTML='<div class="card">'+badge+'<div style="margin-top:8px">'+esc(j.company)+' ('+esc(j.ticker)+')</div>'
+'<div class="grid">'
+'<div class="kpi"><small>Revenue</small><b>'+esc(fmtB(L.revenue))+'</b></div>'
+'<div class="kpi"><small>Net Income</small><b>'+esc(fmtB(L.netIncome))+'</b></div>'
+'<div class="kpi"><small>Assets</small><b>'+esc(fmtB(L.assets))+'</b></div>'
+'<div class="kpi"><small>EPS</small><b>'+esc(eps)+'</b></div></div></div>';
}catch(e){out.innerHTML='<div class="card err">'+esc(e.message)+'</div>';}
finally{btn.disabled=false;}
}
window.onload=()=>search();
</script>
</body>
</html>
