<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRUE LIVE SEC V45</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1c;color:#e2e8f0;font-family:'Segoe UI',Tahoma,sans-serif;padding:15px}
.container{max-width:900px;margin:auto}
.header{text-align:center;padding:22px;border:2px solid #00ff88;border-radius:16px;margin-bottom:20px;background:#0f1a2e}
.header h1{color:#00ff88;font-size:28px}
.badge{display:inline-block;background:#00ff88;color:#000;padding:4px 10px;border-radius:20px;font-size:11px;margin:4px;font-weight:bold}
.search-box{display:flex;gap:10px;margin:20px 0}
.search-box input{flex:1;padding:14px;border-radius:10px;border:1px solid #1e3a5f;background:#13233f;color:#fff;font-size:16px}
.search-box button{padding:14px 24px;background:#00ff88;color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{padding:8px 14px;background:#1e293b;border:1px solid #334155;border-radius:20px;cursor:pointer;font-size:13px}
.chip:hover{border-color:#00ff88;color:#00ff88}
.card{background:#0f1a2e;border:1px solid #1e3a5f;border-radius:14px;padding:18px;margin-bottom:14px}
.card h3{color:#00ff88;margin-bottom:12px;font-size:16px;border-bottom:1px solid #1e3a5f;padding-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:#13233f;padding:10px;border-radius:8px;word-break:break-word}
.item b{color:#94a3b8;font-size:11px;display:block}
.item span{font-size:14px;font-weight:bold}
.footer{text-align:center;font-size:11px;color:#64748b;margin-top:30px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>TRUE LIVE SEC V45</h1>
    <div>SECURE API ROUTE</div>
    <div>
      <span class="badge">SEC EDGAR</span>
      <span class="badge">VERCEL API</span>
      <span class="badge">NO CORS</span>
    </div>
  </div>

  <div class="search-box">
    <input id="q" placeholder="اكتب Tesla, Apple او TSLA, AAPL">
    <button onclick="search()">بحث عميق</button>
  </div>

  <div class="chips">
    <div class="chip" onclick="setQ('AAPL')">AAPL Apple</div>
    <div class="chip" onclick="setQ('TSLA')">TSLA Tesla</div>
    <div class="chip" onclick="setQ('NVDA')">NVDA Nvidia</div>
    <div class="chip" onclick="setQ('MSFT')">MSFT Microsoft</div>
    <div class="chip" onclick="setQ('Tesla')">Tesla</div>
    <div class="chip" onclick="setQ('Nvidia')">Nvidia</div>
  </div>

  <div id="result"></div>
  <div class="footer">V45 - Secure API - المصدر: SEC.gov عبر /api/sec</div>
</div>

<script>
const MAP = {
  "tesla":"TSLA","tesla inc":"TSLA","nvidia":"NVDA","apple":"AAPL","apple inc":"AAPL",
  "microsoft":"MSFT","google":"GOOGL","alphabet":"GOOGL","amazon":"AMZN",
  "meta":"META","facebook":"META","netflix":"NFLX"
};

async function api(params){
  const r = await fetch('/api/sec?' + new URLSearchParams(params));
  if(!r.ok){
    let msg = 'HTTP ' + r.status;
    try{ msg = (await r.json()).error || msg; }catch(e){}
    throw new Error(msg);
  }
  return r.json();
}

function setQ(v){ document.getElementById('q').value = v; search(); }

async function search(){
  const raw = document.getElementById('q').value.trim().toLowerCase();
  if(!raw) return;
  const ticker = MAP[raw] || raw.toUpperCase();
  const box = document.getElementById('result');
  box.innerHTML = `<div class="card">جاري الجلب من SEC لـ ${ticker}...</div>`;
  try{
    const tData = await api({type:'tickers'});
    let company = null;
    for(const k in tData){
      if(tData[k].ticker === ticker){ company = tData[k]; break; }
    }
    if(!company) throw new Error('Ticker غير موجود في SEC');
    const cik = String(company.cik_str);
    const [sub, fin] = await Promise.all([
      api({type:'submissions', cik}),
      api({type:'facts', cik})
    ]);
    render(ticker, sub, fin);
  }catch(e){
    box.innerHTML = `<div class="card" style="border-color:#ff4444">خطأ: ${e.message}<br><small>لو 404: تأكد إن api/sec.js مرفوع جوه فولدر api، وإنك فاتح موقع Vercel مش المعاينة</small></div>`;
  }
}

function render(ticker, p, f){
  const fmt = o => o ? `$${(o.val/1e9).toFixed(2)}B <small>(${o.end})</small>` : 'N/A';
  document.getElementById('result').innerHTML = `
  <div class="card">
    <h3>${p.name || ticker} (${ticker})</h3>
    <div class="grid">
      <div class="item"><b>الموقع</b><span>${p.website || 'N/A'}</span></div>
      <div class="item"><b>التليفون</b><span>${p.phone || 'N/A'}</span></div>
      <div class="item"><b>العنوان</b><span>${p.address || 'N/A'}</span></div>
      <div class="item"><b>التصنيف</b><span>${p.sicDescription || 'N/A'}</span></div>
      <div class="item"><b>CIK</b><span>${p.cik || 'N/A'}</span></div>
      <div class="item"><b>آخر تقديم</b><span>${p.lastFilingDate || 'N/A'} ${p.lastFilingForm || ''}</span></div>
    </div>
  </div>
  <div class="card">
    <h3>المالية - آخر سنة 10-K</h3>
    <div class="grid">
      <div class="item"><b>Revenue</b><span>${fmt(f.revenue)}</span></div>
      <div class="item"><b>Net Income</b><span>${fmt(f.netIncome)}</span></div>
      <div class="item"><b>EPS</b><span>${f.eps ? f.eps.val : 'N/A'} <small>${f.eps ? '(' + f.eps.end + ')' : ''}</small></span></div>
      <div class="item"><b>Assets</b><span>${fmt(f.assets)}</span></div>
      <div class="item"><b>Cash</b><span>${fmt(f.cash)}</span></div>
      <div class="item"><b>Debt</b><span>${fmt(f.debt)}</span></div>
    </div>
  </div>`;
}
</script>
</body>
</html>
