<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRUE LIVE SEC V34 ULTIMATE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#020617;color:#fff;font-family:system-ui;padding:15px}
.container{max-width:700px;margin:0 auto}h1{text-align:center;margin:10px 0;font-size:26px}
.sub{text-align:center;color:#94a3b8;margin-bottom:20px;font-size:12px;line-height:1.5}
.card{background:#1e293b;border-radius:20px;padding:20px;border:1px solid #334155}
input{width:100%;background:#0f172a;border:2px solid #334155;border-radius:14px;padding:16px;font-size:20px;color:#fff;text-align:center;outline:none}
input:focus{border-color:#22c55e}button{width:100%;background:#22c55e;color:#000;border:none;padding:16px;border-radius:14px;font-size:18px;font-weight:bold;margin-top:12px;cursor:pointer}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.quick span{background:#334155;padding:8px 14px;border-radius:20px;font-size:14px;cursor:pointer}
.result{margin-top:15px}.ok{color:#22c55e}.err{color:#ef4444}
pre{background:#0f172a;padding:12px;border-radius:12px;overflow:auto;font-size:11px;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold;margin:2px}
.badge-live{background:#22c55e;color:#000}.badge-cache{background:#f59e0b;color:#000}
.data-box{background:#0f172a;padding:14px;border-radius:14px;margin:10px 0;border:1px solid #334155}
</style>
</head>
<body>
<div class="container">
<h1>⚡ TRUE LIVE SEC V34</h1>
<div class="sub">سريع + ذكي + يشتغل حتى لو SEC قفل!<br>Contact: Mahmoudsalem2080@gmail.com<br><span style="color:#22c55e">V34 ULTIMATE - لا يفشل أبداً</span></div>
<div class="card">
<input id="q" placeholder="اكتب AAPL او MSFT او TSLA" value="AAPL">
<button onclick="search()">🚀 بحث الآن</button>
<div class="quick">
<span onclick="setQ('AAPL')">AAPL</span><span onclick="setQ('MSFT')">MSFT</span><span onclick="setQ('TSLA')">TSLA</span><span onclick="setQ('NVDA')">NVDA</span><span onclick="setQ('GOOGL')">GOOGL</span><span onclick="setQ('AMZN')">AMZN</span><span onclick="setQ('META')">META</span><span onclick="setQ('NFLX')">NFLX</span>
</div>
<div id="out" class="result"><div style="text-align:center;color:#64748b">جاهز للبحث...</div></div>
</div>
</div>
<script>
const REAL_DATA = {
  "AAPL": {cik:"0000320193", name:"Apple Inc.", ticker:"AAPL", revenue:383285000000, revenueEnd:"2023-09-30", income:96995000000, incomeEnd:"2023-09-30", assets:352583000000, assetsEnd:"2023-09-30", eps:6.13},
  "MSFT": {cik:"0000789019", name:"Microsoft Corp", ticker:"MSFT", revenue:211915000000, revenueEnd:"2023-06-30", income:72361000000, incomeEnd:"2023-06-30", assets:411976000000, assetsEnd:"2023-06-30", eps:9.68},
  "TSLA": {cik:"0001318605", name:"Tesla Inc", ticker:"TSLA", revenue:96773000000, revenueEnd:"2023-12-31", income:14973000000, incomeEnd:"2023-12-31", assets:106618000000, assetsEnd:"2023-12-31", eps:4.3},
  "NVDA": {cik:"0001045810", name:"NVIDIA Corp", ticker:"NVDA", revenue:79033000000, revenueEnd:"2024-01-28", income:29760000000, incomeEnd:"2024-01-28", assets:65728000000, assetsEnd:"2024-01-28", eps:11.93},
  "GOOGL": {cik:"0001652044", name:"Alphabet Inc.", ticker:"GOOGL", revenue:307394000000, revenueEnd:"2023-12-31", income:73795000000, incomeEnd:"2023-12-31", assets:402392000000, assetsEnd:"2023-12-31", eps:5.8},
  "AMZN": {cik:"0001018724", name:"Amazon.com Inc", ticker:"AMZN", revenue:513983000000, revenueEnd:"2022-12-31", income:-2728000000, incomeEnd:"2022-12-31", assets:462675000000, assetsEnd:"2022-12-31", eps:-0.27},
  "META": {cik:"0001326801", name:"Meta Platforms Inc", ticker:"META", revenue:116609000000, revenueEnd:"2022-12-31", income:23200000000, incomeEnd:"2022-12-31", assets:185727000000, assetsEnd:"2022-12-31", eps:8.59},
  "NFLX": {cik:"0001065280", name:"Netflix Inc", ticker:"NFLX", revenue:31615000000, revenueEnd:"2022-12-31", income:4491000000, incomeEnd:"2022-12-31", assets:48594000000, assetsEnd:"2022-12-31", eps:10.1}
};
const KNOWN_CIK = {"AAPL":"0000320193","MSFT":"0000789019","TSLA":"0001318605","NVDA":"0001045810","GOOGL":"0001652044","GOOG":"0001652044","AMZN":"0001018724","META":"0001326801","NFLX":"0001065280"};
function setQ(v){document.getElementById('q').value=v; search();}
async function tryFetch(url){
  const proxies = [
    (u)=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    (u)=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
    (u)=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
  ];
  for(let p of proxies){
    try{
      const proxyUrl = p(url);
      const r = await fetch(proxyUrl);
      if(r.ok){
        const text = await r.text();
        if(text && text.length > 100) return JSON.parse(text);
      }
    }catch(e){ continue; }
  }
  return null;
}
async function search(){
  const q=document.getElementById('q').value.trim().toUpperCase(); if(!q) return;
  const out=document.getElementById('out');
  out.innerHTML='<div style="text-align:center;padding:20px">⏳ جاري البحث عن '+q+'...</div>';
  const ticker = q; const cik = KNOWN_CIK[ticker] || null; const fallback = REAL_DATA[ticker] || null;
  if(fallback){ out.innerHTML = `<div style="text-align:center"><span class="badge badge-cache">⚡ عرض سريع</span><br><small style="color:#94a3b8">جاري محاولة LIVE...</small></div>${renderData(fallback, false)}`; }
  if(!cik){ out.innerHTML='<div class=err>❌ جرب: AAPL, MSFT, TSLA, NVDA, GOOGL, AMZN, META, NFLX</div>'; return; }
  try{
    const factsUrl = `https://data.sec.gov/api/xbrl/companyfacts/CIK${cik}.json`;
    const facts = await tryFetch(factsUrl);
    if(facts && facts.facts){
      const usd=facts.facts?.['us-gaap']||{}; const get=(c)=>{const a=usd[c]?.units?.USD; if(!a?.length) return null; return [...a].sort((a,b)=>new Date(b.end)-new Date(a.end))[0];};
      const rev=get('Revenues')||get('RevenueFromContractWithCustomerExcludingAssessedTax')||get('SalesRevenueNet'); const inc=get('NetIncomeLoss'); const ast=get('Assets');
      const liveData = {cik, ticker, name: facts.entityName || fallback?.name || q, revenue: rev?.val || fallback?.revenue, revenueEnd: rev?.end || fallback?.revenueEnd, income: inc?.val || fallback?.income, incomeEnd: inc?.end || fallback?.incomeEnd, assets: ast?.val || fallback?.assets, assetsEnd: ast?.end || fallback?.assetsEnd, live: true};
      out.innerHTML = `<div style="text-align:center"><span class="badge badge-live">✅ LIVE من SEC EDGAR</span></div>${renderData(liveData, true)}`;
    }else{
      if(fallback){ out.innerHTML = `<div style="text-align:center"><span class="badge badge-cache">📦 بيانات حقيقية محفوظة</span></div>${renderData(fallback, false)}`; }
    }
  }catch(e){
    if(fallback){ out.innerHTML = `<div style="text-align:center"><span class="badge badge-cache">📦 بيانات حقيقية محفوظة</span></div>${renderData(fallback, false)}`; }
  }
}
function renderData(d, isLive){
  const revB = d.revenue ? (d.revenue/1e9).toFixed(2) : 'N/A'; const incB = d.income ? (d.income/1e9).toFixed(2) : 'N/A'; const astB = d.assets ? (d.assets/1e9).toFixed(2) : 'N/A';
  const src = isLive ? 'SEC EDGAR LIVE ✅' : 'قاعدة بيانات حقيقية 📦';
  return `<div class="data-box"><div style="font-size:18px;font-weight:bold;text-align:center">${d.name} (${d.ticker})</div><div style="text-align:center;color:#94a3b8;font-size:12px">CIK: ${d.cik} | ${src}</div><div style="margin-top:12px"><div>💰 الإيرادات: ${revB} مليار $ <small>(${d.revenueEnd||''})</small></div><div>📈 الدخل: ${incB} مليار $ <small>(${d.incomeEnd||''})</small></div><div>🏦 الأصول: ${astB} مليار $ <small>(${d.assetsEnd||''})</small></div>${d.eps?`<div>💵 EPS: ${d.eps} $</div>`:''}</div></div><pre>${JSON.stringify({ok:true, source: src, cik: d.cik, ticker: d.ticker, company: d.name, financials: {revenue:{value:d.revenue,end:d.revenueEnd}, netIncome:{value:d.income,end:d.incomeEnd}, assets:{value:d.assets,end:d.assetsEnd}}, timestamp:new Date().toISOString()}, null, 2)}</pre>`;
}
window.onload=()=>search();
</script>
</body>
</html>
