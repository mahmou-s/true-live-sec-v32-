<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إعادة تعيين كلمة المرور — MSMMK</title>
<link rel="stylesheet" href="/app.css">
<style>
.wrap{max-width:420px;margin:40px auto;padding:16px}
input[type=password]{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 12px;border:1px solid #ccc;border-radius:6px;font-size:16px}
.primary{background:#1a6fd4;color:#fff;border:0;border-radius:6px;padding:12px;width:100%;font-size:16px;cursor:pointer}
.msg{margin:10px 0;padding:10px;border-radius:6px}
.msg.ok{background:#e6f7e9;color:#176f2c}
.msg.err{background:#fde8e8;color:#a31212}
</style>
</head>
<body>
<main class="page wrap">
<h1>كلمة مرور جديدة</h1>
<div id="msg"></div>
<div id="app"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://migckovlfckdnsanemkd.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY_HERE';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
function setMsg(t, k) { $('msg').innerHTML = t ? '<div class="msg ' + k + '">' + t + '</div>' : ''; }

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    setMsg('رابط التعيين غير صالح أو منتهي. اطلب رابط جديد من صفحة الأدمن.', 'err');
    return;
  }
  $('app').innerHTML =
    '<label>كلمة المرور الجديدة</label><input id="p1" type="password">' +
    '<label>تأكيد كلمة المرور</label><input id="p2" type="password">' +
    '<button class="primary" id="go">حفظ كلمة المرور</button>';
  $('go').onclick = async () => {
    const p1 = $('p1').value, p2 = $('p2').value;
    if (p1.length < 6) { setMsg('كلمة المرور لازم تكون 6 حروف على الأقل', 'err'); return; }
    if (p1 !== p2) { setMsg('كلمتا المرور مش متطابقتين', 'err'); return; }
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) setMsg(error.message, 'err');
    else setMsg('تم الحفظ بنجاح. تقدر تسجّل دخول دلوقتي في admin.html.', 'ok');
  };
}
init();
</script>
</body>
</html>
