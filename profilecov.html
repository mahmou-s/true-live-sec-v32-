<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار التغطية</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1c;color:#e2e8f0;font-family:'Segoe UI',Tahoma,sans-serif;padding:15px}
.w{max-width:900px;margin:auto}
h1{color:#00ff88;font-size:22px;margin:10px 0}
.card{background:#0f1a2e;border:1px solid #1e3a5f;border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #1e3a5f;font-size:14px}
button{width:100%;padding:14px;background:#00ff88;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}
button:disabled{opacity:.5}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #1e3a5f;background:#13233f;color:#fff;font-size:16px;margin:10px 0}
pre{white-space:pre-wrap;direction:ltr;text-align:left;font-size:12px;color:#94a3b8;margin-top:8px}
.bar{height:8px;background:#1e293b;border-radius:6px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:#00ff88;width:0}
</style>
</head>
<body>
<div class="w">
<h1>اختبار تغطية بيانات الهوية والتواصل</h1>
<div class="card">
<p>بياخد عينة عشوائية من شركات SEC، ويقيس نسبة امتلاء الموقع والتليفون والعنوان والوصف.</p>
<input id="n" type="number" value="100" min="10" max="300">
<button id="go">ابدأ الاختبار</button>
<div class="bar"><i id="bar"></i></div>
<div id="st"></div>
</div>
<div id="out"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const FIELDS = [
  ['موقع الشركة', (p) => p.website],
  ['موقع المستثمرين', (p) => p.investorWebsite],
  ['موقع او موقع مستثمرين', (p) => p.website || p.investorWebsite],
  ['وصف النشاط', (p) => p.description],
  ['تليفون', (p) => p.phone],
  ['عنوان المقر (شارع)', (p) => p.business && p.business.street],
  ['مدينة وولاية المقر', (p) => p.business && p.business.city && p.business.state],
  ['الرمز البريدي', (p) => p.business && p.business.zip]
];
async function getJson(u) {
  const r = await fetch(u);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function pick(list, n) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, n);
}
async function one(c) {
  try { return { c, p: await getJson('/api/profile?cik=' + encodeURIComponent(c.cik)) }; }
  catch (e) { return { c, err: e.message }; }
}
async function run() {
  const n = Math.min(300, Math.max(10, Number($('n').value) || 100));
  $('go').disabled = true; $('out').innerHTML = ''; $('bar').style.width = '0';
  try {
    $('st').textContent = 'تحميل قايمة الشركات...';
    const d = await getJson('/api/sec?type=tickers');
    const seen = new Set();
    const all = Object.values(d).filter((x) => !seen.has(x.cik_str) && seen.add(x.cik_str)).map((x) => ({ ticker: x.ticker, title: x.title, cik: String(x.cik_str) }));
    const sample = pick(all, n), res = [];
    let i = 0;
    const worker = async () => {
      while (i < sample.length) {
        res.push(await one(sample[i++]));
        $('bar').style.width = (res.length / sample.length * 100) + '%';
        $('st').textContent = res.length + ' / ' + sample.length;
        await sleep(250);
      }
    };
    await Promise.all([worker(), worker()]);
    show(all.length, res);
  } catch (e) { $('out').innerHTML = '<div class="card">خطأ: ' + esc(e.message) + '</div>'; }
  $('go').disabled = false;
}
function show(total, res) {
  const er = res.filter((r) => r.err), okr = res.filter((r) => r.p);
  const tg = okr.filter((r) => r.p.lastAnnual && r.p.lastAnnual.form !== '40-F');
  const f40 = okr.filter((r) => r.p.lastAnnual && r.p.lastAnnual.form === '40-F').length;
  const no = okr.length - tg.length - f40;
  const row = (a, b) => '<div class="row"><span>' + a + '</span><b><bdi dir="ltr">' + b + '</bdi></b></div>';
  const pct = (n) => n + ' (' + (tg.length ? (n / tg.length * 100).toFixed(0) : 0) + '%)';
  const fields = FIELDS.map((f) => row(f[0], pct(tg.filter((r) => f[1](r.p)).length))).join('');
  const k10 = tg.filter((r) => r.p.lastAnnual.form === '10-K').length;
  const line = (r) => r.c.ticker + ' | ' + r.c.title + ' | ' + r.c.cik;
  const webs = tg.filter((r) => r.p.website).slice(0, 15).map((r) => r.c.ticker + ' | ' + r.p.website).join('\n');
  const noweb = tg.filter((r) => !r.p.website && !r.p.investorWebsite).slice(0, 25).map(line).join('\n');
  $('out').innerHTML = '<div class="card"><h1>النتيجة</h1>' + row('شركات فريدة في قايمة SEC', total) + row('حجم العينة', res.length)
    + row('خطأ في الطلب', er.length) + row('بتقدم 10-K او 20-F (المستهدفة)', tg.length + ' (10-K: ' + k10 + ')')
    + row('بدون تقرير سنوي (صناديق/ADR/غيره)', no) + row('40-F', f40)
    + '</div><div class="card"><h1>امتلاء الحقول (من المستهدفة)</h1>' + fields
    + '</div><div class="card"><b>امثلة مواقع موجودة</b><pre>' + esc(webs || 'لا يوجد') + '</pre></div>'
    + '<div class="card"><b>مستهدفة بدون اي موقع (عينة)</b><pre>' + esc(noweb || 'لا يوجد') + '</pre></div>';
}
$('go').addEventListener('click', run);
</script>
</body>
</html>
