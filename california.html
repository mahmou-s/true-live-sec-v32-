<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شركات كاليفورنيا الزراعية</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1c;color:#e2e8f0;font-family:'Segoe UI',Tahoma,sans-serif;padding:15px}
.w{max-width:900px;margin:auto}
h1{color:#00ff88;font-size:22px;margin:10px 0}
.sub{color:#94a3b8;font-size:13px;margin-bottom:12px;line-height:1.7}
.warn{border:1px solid #f59e0b;color:#fbbf24;border-radius:10px;padding:10px;font-size:12px;margin-bottom:12px;line-height:1.7}
.card{background:#0f1a2e;border:1px solid #1e3a5f;border-radius:14px;padding:14px;margin-bottom:10px}
.card b.n{color:#00ff88;font-size:15px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.f input,.f select{width:100%;padding:11px;border-radius:10px;border:1px solid #1e3a5f;background:#13233f;color:#fff;font-size:15px}
.f input{grid-column:1/-1}
.m{color:#94a3b8;font-size:12px;margin-top:5px;line-height:1.7}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;border:1px solid #334155;margin:4px 0 0 6px}
.tag.ok{border-color:#00ff88;color:#00ff88}
a{color:#00ff88}
button{width:100%;padding:12px;background:#13233f;color:#00ff88;border:1px solid #00ff88;border-radius:10px;font-weight:bold;font-size:15px;cursor:pointer;margin:6px 0 14px}
.cnt{color:#94a3b8;font-size:13px;margin-bottom:8px}
</style>
</head>
<body>
<div class="w">
<h1>شركات كاليفورنيا الزراعية <span class="tag ok">نسخة أولية</span></h1>
<p class="sub">منشآت لحوم ودواجن وبيض في كاليفورنيا، من دليل USDA FSIS.</p>
<div class="warn">هذه النسخة تغطي اللحوم والدواجن والبيض فقط. الفواكه والمكسرات والخضار والألبان غير مشمولة بعد. السجلات "مكتشفة" وغير موثّقة، وتصنيف النوع والمنتجات مشتق من أنواع النشاط في المصدر.</div>
<div class="f">
<input id="q" placeholder="ابحث بالاسم او المدينة..." autocomplete="off">
<select id="kind"><option value="producer">منتج / معالج</option><option value="service">خدمي</option><option value="">الكل</option></select>
<select id="prod"><option value="">كل المنتجات</option><option value="meat">لحوم</option><option value="poultry">دواجن</option><option value="egg">بيض</option><option value="rabbit">أرانب</option></select>
<select id="county" style="grid-column:1/-1"></select>
</div>
<div class="cnt" id="cnt"></div>
<div id="list"></div>
<button id="more" style="display:none">عرض المزيد</button>
<p class="m" id="src"></p>
  </div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PROD = { meat: 'لحوم', poultry: 'دواجن', egg: 'بيض', rabbit: 'أرانب' };
const SIZE = { Large: 'كبيرة', Small: 'صغيرة', 'Very Small': 'صغيرة جدا' };
let ALL = [], shown = 50, SRC = null;
function filtered() {
  const q = $('q').value.trim().toLowerCase(), c = $('county').value, k = $('kind').value, p = $('prod').value;
  return ALL.filter((x) => (!k || x.kind === k) && (!c || x.address.county === c) && (!p || x.products.includes(p))
    && (!q || (x.name + ' ' + x.dbas.join(' ') + ' ' + x.address.city).toLowerCase().includes(q)));
}
function card(x) {
  const a = x.address;
  const ph = x.phone ? '<a href="tel:' + esc(x.phone.replace(/[^\d+]/g, '')) + '">' + esc(x.phone) + '</a>' : 'غير متوفر';
  const map = 'https://www.google.com/maps?q=' + encodeURIComponent(a.lat + ',' + a.lon);
  const tags = x.products.map((p) => '<span class="tag ok">' + esc(PROD[p] || p) + '</span>').join('')
    + (x.size ? '<span class="tag">' + esc(SIZE[x.size] || x.size) + '</span>' : '');
  return '<div class="card"><b class="n"><bdi dir="ltr">' + esc(x.name) + '</bdi></b>'
    + (x.dbas.length ? '<div class="m">اسم تجاري: <bdi dir="ltr">' + esc(x.dbas.join('، ')) + '</bdi></div>' : '')
    + '<div>' + tags + '</div>'
    + '<div class="m">التليفون: <bdi dir="ltr">' + ph + '</bdi></div>'
    + '<div class="m"><bdi dir="ltr">' + esc(a.street + ', ' + a.city + ', ' + a.state + ' ' + a.zip) + '</bdi> · ' + esc(a.county) + ' · <a href="' + map + '" target="_blank" rel="noopener">الخريطة</a></div>'
    + '<div class="m">النشاط: <bdi dir="ltr">' + esc(x.activities.join('; ')) + '</bdi></div></div>';
}
function render() {
  const list = filtered();
  $('cnt').textContent = list.length + ' نتيجة';
  $('list').innerHTML = list.slice(0, shown).map(card).join('') || '<div class="card">ما فيش نتائج.</div>';
  $('more').style.display = list.length > shown ? 'block' : 'none';
}
async function init() {
  try {
    const r = await fetch('/ca-fsis.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    ALL = d.items.slice().sort((a, b) => a.name.localeCompare(b.name));
    SRC = ALL[0] && ALL[0].source;
    const cs = {};
    ALL.forEach((x) => { cs[x.address.county] = (cs[x.address.county] || 0) + 1; });
    $('county').innerHTML = '<option value="">كل المقاطعات</option>' + Object.keys(cs).sort().map((c) => '<option value="' + esc(c) + '">' + esc(c) + ' (' + cs[c] + ')</option>').join('');
    if (SRC) $('src').innerHTML = 'المصدر: <a href="' + esc(SRC.url) + '" target="_blank" rel="noopener">' + esc(SRC.name) + '</a> · بيانات ' + esc(SRC.dataDate) + ' · جُمعت ' + esc(SRC.collectedAt) + ' · الترخيص: ' + esc(SRC.license);
    render();
  } catch (e) { $('list').innerHTML = '<div class="card">حصل خطأ: ' + esc(e.message) + '</div>'; }
}
['q', 'kind', 'prod', 'county'].forEach((id) => $(id).addEventListener('input', () => { shown = 50; render(); }));
$('more').addEventListener('click', () => { shown += 50; render(); });
init();
</script>
</body>
  </html>
