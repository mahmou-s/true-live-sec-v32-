<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار التغطية</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1c;color:#e2e8f0;font-family:'Segoe UI',Tahoma,sans-serif;padding:15px}
.w{max-width:900px;margin:auto}
h1{color:#00ff88;font-size:22px;margin:10px 0}
.card{background:#0f1a2e;border:1px solid #1e3a5f;border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #1e3a5f;font-size:14px}
button{width:100%;padding:14px;background:#00ff88;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}
button:disabled{opacity:.5}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #1e3a5f;background:#13233f;color:#fff;font-size:16px;margin:10px 0}
pre{white-space:pre-wrap;direction:ltr;text-align:left;font-size:12px;color:#94a3b8;margin-top:8px}
.bar{height:8px;background:#1e293b;border-radius:6px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:#00ff88;width:0}
</style>
</head>
<body>
<div class="w">
<h1>اختبار استخراج الموقع والإيميل والنشاط من التقارير</h1>
<div class="card">
<p>بياخد عينة عشوائية، ويقرا تقرير كل شركة، ويقيس كام شركة طلع لها موقع وإيميل ومقتطف نشاط. الحد الاقصى 100، وكل شركة بتاخد ثواني.</p>
<input id="n" type="number" value="40" min="10" max="100">
<button id="go">ابدأ الاختبار</button>
<div class="bar"><i id="bar"></i></div>
<div id="st"></div>
</div>
<div id="out"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function getJson(u) {
  const r = await fetch(u);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function pick(list, n) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, n);
}
async function one(c) {
  try { return { c, f: await getJson('/api/filing?cik=' + encodeURIComponent(c.cik)) }; }
  catch (e) { return { c, err: e.message }; }
}
async function run() {
  const n = Math.min(100, Math.max(10, Number($('n').value) || 40));
  $('go').disabled = true; $('out').innerHTML = ''; $('bar').style.width = '0';
  try {
    $('st').textContent = 'تحميل قايمة الشركات...';
    const d = await getJson('/api/sec?type=tickers');
    const seen = new Set();
    const all = Object.values(d).filter((x) => !seen.has(x.cik_str) && seen.add(x.cik_str)).map((x) => ({ ticker: x.ticker, title: x.title, cik: String(x.cik_str) }));
    const sample = pick(all, n), res = [];
    let i = 0;
    const worker = async () => {
      while (i < sample.length) {
        res.push(await one(sample[i++]));
        $('bar').style.width = (res.length / sample.length * 100) + '%';
        $('st').textContent = res.length + ' / ' + sample.length;
        await sleep(300);
      }
    };
    await Promise.all([worker(), worker()]);
    show(res);
  } catch (e) { $('out').innerHTML = '<div class="card">خطأ: ' + esc(e.message) + '</div>'; }
  $('go').disabled = false;
}
function show(res) {
  const er = res.filter((r) => r.err), nf = res.filter((r) => r.f && !r.f.found), ok = res.filter((r) => r.f && r.f.found);
  const cnt = (fn) => { const n = ok.filter(fn).length; return n + ' (' + (ok.length ? (n / ok.length * 100).toFixed(0) : 0) + '%)'; };
  const row = (a, b) => '<div class="row"><span>' + a + '</span><b><bdi dir="ltr">' + b + '</bdi></b></div>';
  const types = ['procurement', 'partnership', 'investor', 'general'].map((t) => row('إيميل ' + t, cnt((r) => r.f.emails.some((e) => e.type === t)))).join('');
  const line = (r) => r.c.ticker + ' | ' + r.c.title + ' | ' + r.c.cik;
  const ex = ok.filter((r) => r.f.website || r.f.emails.length).slice(0, 15).map((r) => r.c.ticker + ' | ' + (r.f.website || '-') + ' | ' + r.f.emails.map((e) => e.address).join(', ')).join('\n');
  const bz = ok.filter((r) => r.f.business).slice(0, 8).map((r) => r.c.ticker + ': ' + r.f.business.slice(0, 110)).join('\n');
  const bad = er.map((r) => line(r) + ' | ' + r.err).concat(ok.filter((r) => !r.f.business).slice(0, 15).map((r) => line(r) + ' | بدون نشاط ' + r.f.form + (r.f.truncated ? ' مقطوع' : ''))).join('\n');
  $('out').innerHTML = '<div class="card"><h1>النتيجة</h1>' + row('حجم العينة', res.length) + row('خطأ او تاخير', er.length)
    + row('بدون 10-K او 20-F', nf.length) + row('تقارير اتقرت', ok.length)
    + '</div><div class="card"><h1>من التقارير اللي اتقرت</h1>' + row('موقع الشركة', cnt((r) => r.f.website))
    + row('اي إيميل عام', cnt((r) => r.f.emails.length)) + types + row('مقتطف نشاط', cnt((r) => r.f.business))
    + row('تقرير مقطوع (حد الحجم)', cnt((r) => r.f.truncated))
    + '</div><div class="card"><b>امثلة (رمز | موقع | إيميلات)</b><pre>' + esc(ex || 'لا يوجد') + '</pre></div>'
    + '<div class="card"><b>بداية مقتطفات النشاط</b><pre>' + esc(bz || 'لا يوجد') + '</pre></div>'
    + '<div class="card"><b>اخطاء او بدون نشاط</b><pre>' + esc(bad || 'لا يوجد') + '</pre></div>';
}
$('go').addEventListener('click', run);
</script>
</body>
</html>
